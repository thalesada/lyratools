name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        scida: [false, true]
    name: py${{ matrix.python-version }}${{ matrix.scida && ' + scida' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.scida }}" = "true" ]; then pip install ".[scida]"; else pip install .; fi
      - name: scida must be absent in the core job
        if: ${{ !matrix.scida }}
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('scida') is not None)"
      - name: Tests
        # the real-snapshot FUV check runs only when LYRATOOLS_FUV_SNAP and LYRATOOLS_LUV are set (not in CI)
        env:
          MPLBACKEND: Agg
        run: python tests/run_tests.py

  release-tree:
    # the first public tag leaves out the later-release modules: check that the rest still passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/make_release.py "$RUNNER_TEMP/lyratools-public"
      - run: pip install "$RUNNER_TEMP/lyratools-public"
      - run: python "$RUNNER_TEMP/lyratools-public/tests/run_tests.py"
        env:
          MPLBACKEND: Agg
